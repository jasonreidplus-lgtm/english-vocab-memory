name: Build Android APK

# 云端构建完全离线内置的安卓 APK（免本地装 Android Studio）。
# 触发：推送 main、仓库 Actions 手动运行、推送 v* 标签；每周两次保活固定调试签名缓存。
# 产物：Artifacts 始终保留；v* 标签还会创建 GitHub Release，直接附上 APK。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：重新构建并替换指定已有 Release 的 APK（如 v1.2.1）'
        required: false
        type: string
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # 等价改写以重新激活停用的 schedule；仍为每周一、四 03:17 UTC。
    - cron: '17 3 * * MON,THU'

permissions:
  contents: write

# main 构建先生成/保存签名缓存，紧接着的 tag 构建排队复用，避免两个临时 runner 各自产生不同签名。
concurrency:
  group: wordquest-android-signing
  cancel-in-progress: false

jobs:
  # 定时构建本身不算仓库活动；独立保活，不依赖 APK 构建成功。
  keepalive:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    steps:
      - name: Keep scheduled workflows active after 30 days without commits
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          HEAD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')"
          COMMIT_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$HEAD_SHA")"
          LAST_ACTIVITY="$(date -d "$(jq -r '.committer.date' <<< "$COMMIT_JSON")" +%s)"
          if (( $(date +%s) - LAST_ACTIVITY < 30 * 86400 )); then
            echo "Default branch has recent activity; no keepalive commit needed."
            exit 0
          fi
          TREE_SHA="$(jq -r '.tree.sha' <<< "$COMMIT_JSON")"
          NEW_SHA="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" \
            -f message='chore(ci): keep scheduled workflows active' \
            -f tree="$TREE_SHA" -f "parents[]=$HEAD_SHA" --jq '.sha')"
          # 同一棵 tree 的空提交，不改代码/签名；非强制更新，避免覆盖并发推送。
          # GITHUB_TOKEN 产生的 push 不会递归触发 Android / Pages 工作流。
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$DEFAULT_BRANCH" \
            -f sha="$NEW_SHA" -F force=false

  build:
    runs-on: ubuntu-latest
    env:
      WORDQUEST_DEBUG_KEYSTORE: ${{ github.workspace }}/.wordquest-signing/debug.keystore
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Capacitor 8 CLI 要求 Node >= 22
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build web (Vite → dist)
        run: npm run build

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools # 旧 tools 包已移除；command-line tools 由此 action 自行安装。

      # GitHub runner 是临时机；保留同一把 debug key，避免每次 APK 签名变化而无法覆盖安装。
      # 每周两次定时运行会持续访问该缓存，降低因长期未使用被回收的风险。
      - name: Restore stable debug signing key
        id: signing-key-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.WORDQUEST_DEBUG_KEYSTORE }}
          key: wordquest-android-debug-keystore-v2

      # v1.2.1 起不得重新生成私钥；仅从原密钥的持久备份恢复，缓存配置保持不变。
      # 将原 debug.keystore 的 Base64 保存为同名 Actions repository secret。
      - name: Restore original debug signing key if cache is missing
        if: steps.signing-key-cache.outputs.cache-hit != 'true'
        env:
          WORDQUEST_DEBUG_KEYSTORE_BASE64: ${{ secrets.WORDQUEST_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -s "$WORDQUEST_DEBUG_KEYSTORE" ]; then
            exit 0
          fi
          if [ -z "$WORDQUEST_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Original v1.2.1 signing key is missing. Restore it as WORDQUEST_DEBUG_KEYSTORE_BASE64; refusing to generate a replacement key."
            exit 1
          fi
          umask 077
          mkdir -p "$(dirname "$WORDQUEST_DEBUG_KEYSTORE")"
          printf '%s' "$WORDQUEST_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$WORDQUEST_DEBUG_KEYSTORE"

      - name: Verify stable debug signing key
        run: |
          test -s "$WORDQUEST_DEBUG_KEYSTORE"
          keytool -list -keystore "$WORDQUEST_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey >/dev/null
          # 已发布的最终 v1.2.1 证书指纹，见「安卓APK打包说明.md」。
          EXPECTED_SHA256='D7160E22EB7BF7ECC1FE2C8BB53A97AE756C143EAEE2E89C78DF643AFA81BFBA'
          ACTUAL_SHA256="$(keytool -exportcert -rfc -keystore "$WORDQUEST_DEBUG_KEYSTORE" \
            -storepass android -alias androiddebugkey \
            | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Debug signing certificate does not match the original v1.2.1 certificate; refusing to build or publish."
            exit 1
          fi

      - name: Pre-install SDK platform 36 (Capacitor 8 compileSdk)
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Sync Capacitor (dist → android)
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name APK
        run: |
          RELEASE_REF='${{ inputs.release_tag }}'
          if [ -z "$RELEASE_REF" ]; then
            RELEASE_REF="$GITHUB_REF_NAME"
          fi
          SAFE_REF="${RELEASE_REF//\//-}"
          APK_PATH="wordquest-${SAFE_REF}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_REF" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wordquest-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --verify-tag \
              --title "考研词关 $RELEASE_TAG" \
              --generate-notes
          fi
