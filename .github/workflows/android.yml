name: Build Android APK

# 云端构建完全离线内置的安卓 APK（免本地装 Android Studio）。
# 触发：推送 main、仓库 Actions 手动运行、推送 v* 标签；每周两次保活固定调试签名缓存。
# 产物：Artifacts 始终保留；v* 标签还会创建 GitHub Release，直接附上 APK。
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 3 * * 1,4'

permissions:
  contents: write

# main 构建先生成/保存签名缓存，紧接着的 tag 构建排队复用，避免两个临时 runner 各自产生不同签名。
concurrency:
  group: wordquest-android-signing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Capacitor 8 CLI 要求 Node >= 22
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build web (Vite → dist)
        run: npm run build

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # GitHub runner 是临时机；保留同一把 debug key，避免每次 APK 签名变化而无法覆盖安装。
      # 每周两次定时运行会持续访问该缓存，降低因长期未使用被回收的风险。
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: wordquest-android-debug-keystore-v1

      - name: Pre-install SDK platform 36 (Capacitor 8 compileSdk)
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Sync Capacitor (dist → android)
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name APK
        run: |
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          APK_PATH="wordquest-${SAFE_REF}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wordquest-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK_PATH" \
              --verify-tag \
              --title "考研词关 $GITHUB_REF_NAME" \
              --generate-notes
          fi
